name = "sar-canopy-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Free-tier Cloudflare Worker. After `wrangler deploy`, the deploy output prints
# the URL (https://sar-canopy-proxy.<your-subdomain>.workers.dev). Paste that URL
# into the SAR Preflight app: Config tab → "Data proxy URL" (the app ships with a
# built-in default proxy, so this is only needed if you self-host).

# Per-IP rate limit (Cloudflare Workers rate-limiting binding). WAF rate-limiting
# rules do NOT apply to *.workers.dev, so the limit lives in the Worker itself.
# 300 req/min is generous for real app use (a viewshed fetch is a handful of COG
# Range reads across 1-4 tiles) but stops sustained scraping. `period` may only
# be 10 or 60. The worker code guards on the binding existing, so deleting this
# block simply disables rate limiting.
#
# IMPORTANT: rate-limit bindings can ONLY be created by a wrangler deploy (or the
# raw API) — the dashboard has no UI for them, so a paste-deployed Worker runs
# WITHOUT them (the code degrades gracefully). One `wrangler deploy` from this
# folder activates them; bindings persist across later dashboard paste-deploys.
# This is the GA syntax (wrangler >= 4.36, Sept 2025); the beta-era
# [[unsafe.bindings]] form with type = "ratelimit" is deprecated.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Tighter per-IP limit for the /feedback route only (Discord channel spam
# protection): 3 messages/min is plenty for a human, useless for a flood script.
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# The /feedback route also needs the DISCORD_WEBHOOK_URL secret (the Discord
# channel webhook it forwards to). Secrets are NEVER put in this file — set it
# once with `wrangler secret put DISCORD_WEBHOOK_URL` (paste the URL when
# prompted), or in the dashboard: Worker → Settings → Variables & Secrets →
# Add → type Secret. Without it the route answers 503 and the app reports
# feedback as unavailable — everything else keeps working.
