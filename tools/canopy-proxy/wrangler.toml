name = "sar-canopy-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Free-tier Cloudflare Worker. After `wrangler deploy`, the deploy output prints
# the URL (https://sar-canopy-proxy.<your-subdomain>.workers.dev). Paste that URL
# into the SAR Preflight app: Config tab → "Data proxy URL" (the app ships with a
# built-in default proxy, so this is only needed if you self-host).

# Per-IP rate limit (Cloudflare Workers rate-limiting binding). WAF rate-limiting
# rules do NOT apply to *.workers.dev, so the limit lives in the Worker itself.
# 300 req/min is generous for real app use (a viewshed fetch is a handful of COG
# Range reads across 1-4 tiles) but stops sustained scraping. `period` may only
# be 10 or 60. The worker code guards on the binding existing, so deleting this
# block simply disables rate limiting.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 300, period = 60 }
